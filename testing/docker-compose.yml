# Configr container test matrix
# Usage:
#   docker compose -f testing/docker-compose.yml build
#   docker compose -f testing/docker-compose.yml run --rm ubuntu-test
#   docker compose -f testing/docker-compose.yml run --rm fedora-test
#   docker compose -f testing/docker-compose.yml --profile all up --abort-on-container-exit

services:
  ubuntu-test:
    profiles: ["all", "ubuntu"]
    build:
      context: ..
      dockerfile: testing/containers/ubuntu/Dockerfile
    working_dir: /app
    volumes:
      - ..:/app
      - pub-cache:/root/.pub-cache
    environment:
      - CONFIGR_TEST_ENV=ubuntu
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
    command: >
      sh -c "dart pub get && dart test test/integration/sweep_test.dart test/integration/command_integration_test.dart --tags debian"

  debian-test:
    profiles: ["all", "debian"]
    build:
      context: ..
      dockerfile: testing/containers/debian/Dockerfile
