# Configr test configuration

# Custom test tags for container-based testing
tags:
  container:
    description: "Tests require a running Docker daemon (slow, opt-in)"
  debian:
    description: "Tests that require Debian/Ubuntu environment"
  ubuntu:
    description: "Tests that require Ubuntu environment"
  fedora:
    description: "Tests that require Fedora/RHEL environment"
  arch:
    description: "Tests that require Arch Linux environment"
  alpine:
    description: "Tests that require Alpine Linux environment"
  macos:
    description: "Tests that run on macOS hosts"
  windows:
    description: "Tests that run on Windows hosts"
  needs-docker:
    description: "Tests that require Docker-in-Docker or Docker socket"
  needs-systemd:
    description: "Tests that require systemd (needs privileged container)"
  needs-root:
    description: "Tests that require root privileges (useradd, groupdel, etc.)"
  destructive:
    description: "Tests that modify system state and should run in isolation"

# File-level @Tags() annotations apply to all tests in the file
# Container tests are tagged 'container' — exclude via --exclude-tags container
add_default_tags: true
