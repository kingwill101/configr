# User-specific logging configuration
[loggers]
keys=root,userapp

[handlers]
keys=consoleHandler,userFileHandler

[formatters]
keys=simpleFormatter

[logger_root]
level=INFO
handlers=consoleHandler

[logger_userapp]
level=INFO
handlers=userFileHandler
qualname=userapp
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=simpleFormatter
args=(sys.stdout,)

[handler_userFileHandler]
class=FileHandler
level=INFO
formatter=simpleFormatter
args=('/home/user/.config/myapp/user.log',)

[formatter_simpleFormatter]
format=%(asctime)s - %(levelname)s - %(message)s
