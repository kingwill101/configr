# npm.conf — JavaScript/Node.js global packages
#
# Runs without sudo (npm installs to user's home by default).
# Skip-if-installed prevents re-installing what's already there.

package {
  type = "package"
  package_manager = "npm"
  operation = "install"
  packages += "typescript"
  packages += "prettier"
  packages += "eslint"
  skip_if_installed = true
}
