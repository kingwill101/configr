# apt.conf — Debian/Ubuntu system packages
#
# Uses `sudo` via the privilege escalation layer. In Docker the
# configr binary is pre-compiled so this runs automatically.

package {
  type = "package"
  package_manager = "apt"
  operation = "install"
  packages += "curl"
  packages += "git"
  packages += "htop"
  packages += "tree"
  packages += "jq"
  update_cache = true
  skip_if_installed = true
}
