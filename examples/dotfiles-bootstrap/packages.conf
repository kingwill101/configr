# packages.conf — installed via ecosystem package manager

journal {
  action = "install"
  target = "cli-tools"
  status = "started"
}

package {
  type = "package"
  package_manager = "apt"
  packages += "curl"
  packages += "git"
  packages += "htop"
  packages += "vim"
  packages += "zsh"
  packages += "tmux"
  packages += "ripgrep"
  packages += "fd-find"
  packages += "fzf"
  packages += "bat"
  packages += "eza"
}

journal {
  action = "install"
  target = "cli-tools"
  status = "done"
}
