# dotfiles.conf — config file deployment
# Destinations are relative to CWD; use absolute paths (or ensure `~` gets
# expanded by an upstream pre-processor) for real-world usage.
journal {
  action = "deploy"
  target = "dotfiles"
  status = "started"
}

resource {
  destination = "output/git"
  actions {
    copy {
      source = "dotfiles/gitconfig"
      destination = "output/gitconfig"
    }
    copy {
      source = "dotfiles/gitignore_global"
      destination = "output/gitignore"
    }
  }
}

resource {
  destination = "output/nvim"
  actions {
    copy {
      source = "dotfiles/init.lua"
      destination = "output/init.lua"
    }
  }
}

resource {
  destination = "output/kitty"
  actions {
    copy {
      source = "dotfiles/kitty.conf"
      destination = "output/kitty.conf"
    }
  }
}

resource {
  destination = "output"
  actions {
    copy {
      source = "dotfiles/zshrc"
      destination = "output/zshrc"
    }
  }
}

journal {
  action = "deploy"
  target = "dotfiles"
  status = "done"
}
