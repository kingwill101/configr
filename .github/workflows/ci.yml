name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart analyze

  analyze-windows:
    if: ${{ false }} # Temporarily disabled while platform portability is assessed.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart analyze

  analyze-macos:
    if: ${{ false }} # Temporarily disabled while platform portability is assessed.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart analyze

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart test --exclude-tags container --exclude-tags integration

  unit-tests-windows:
    if: ${{ false }} # Temporarily disabled while platform portability is assessed.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart test --exclude-tags container --exclude-tags integration

  unit-tests-macos:
    if: ${{ false }} # Temporarily disabled while platform portability is assessed.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart test --exclude-tags container --exclude-tags integration

  sweep-tests:
    if: ${{ false }} # Temporarily disabled while platform portability is assessed.
    name: sweep-tests (${{ matrix.test-env }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            test-env: macos
          - os: windows-latest
            test-env: windows
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - name: Run sweep apply and rollback tests
        env:
          CONFIGR_TEST_ENV: ${{ matrix.test-env }}
          CONFIGR_TEST_ROLLBACK: "1"
        run: dart test test/integration/sweep_test.dart --reporter=expanded

  integration-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        distro: [ubuntu, debian, fedora, arch, alpine]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.distro }} container
        run: docker compose -f testing/docker-compose.yml build ${{ matrix.distro }}-test
      - name: Run ${{ matrix.distro }} integration tests
        run: docker compose -f testing/docker-compose.yml run --rm ${{ matrix.distro }}-test
