name: Build CLI

on:
  push:
    branches: [main]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            executable: configr
          - os: macos-latest
            target: macos-x64
            executable: configr
          - os: windows-latest
            target: windows-x64
            executable: configr.exe

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Build executable
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(awk '/^version:/ {print $2; exit}' pubspec.yaml)"
          GIT_SHA="${GITHUB_SHA}"
          GIT_SHORT_SHA="${GITHUB_SHA:0:12}"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [[ -n "$(git status --porcelain)" ]]; then
            GIT_DIRTY=true
          else
            GIT_DIRTY=false
          fi

          STAGING="dist/configr-${{ matrix.target }}"
          mkdir -p "$STAGING"

          dart compile exe \
            -DCONFIGR_VERSION="$VERSION" \
            -DCONFIGR_GIT_SHA="$GIT_SHA" \
            -DCONFIGR_GIT_SHORT_SHA="$GIT_SHORT_SHA" \
            -DCONFIGR_GIT_DIRTY="$GIT_DIRTY" \
            -DCONFIGR_BUILD_DATE="$BUILD_DATE" \
            -DCONFIGR_BUILD_NUMBER="$GITHUB_RUN_NUMBER" \
            -DCONFIGR_BUILD_REF="$GITHUB_REF_NAME" \
            -DCONFIGR_BUILD_SOURCE="github-actions" \
            -DCONFIGR_BUILD_TARGET="${{ matrix.target }}" \
            bin/configr.dart \
            -o "$STAGING/${{ matrix.executable }}"

          "$STAGING/${{ matrix.executable }}" --version

          cp README.md LICENSE "$STAGING/"
          ARCHIVE="dist/configr-${{ matrix.target }}.tar.gz"
          tar -czf "$ARCHIVE" -C dist "configr-${{ matrix.target }}"

          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          else
            shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          fi

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: configr-${{ matrix.target }}
          path: |
            dist/configr-${{ matrix.target }}.tar.gz
            dist/configr-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          draft: false
          prerelease: false
