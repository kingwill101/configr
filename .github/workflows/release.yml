name: Build and Release

permissions:
  contents: write
  actions: write

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

jobs:
  build:
    name: Build and Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            output_name: configr-linux
          - os: windows-latest
            output_name: configr-windows
          - os: macos-latest
            output_name: configr-macos

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Build executable
        run: |
          GIT_SHA="${{ github.sha }}"
          GIT_SHORT_SHA="${GIT_SHA:0:7}"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          dart compile exe \
            -DCONFIGR_VERSION=${{ github.ref_name }} \
            -DCONFIGR_GIT_SHA=$GIT_SHA \
            -DCONFIGR_GIT_SHORT_SHA=$GIT_SHORT_SHA \
            -DCONFIGR_BUILD_DATE=$BUILD_DATE \
            -DCONFIGR_BUILD_NUMBER=${{ github.run_number }} \
          -DCONFIGR_BUILD_REF=${{ github.ref }} \
          -DCONFIGR_BUILD_SOURCE=${{ github.server_url }}/${{ github.repository }} \
          -DCONFIGR_BUILD_TARGET=${{ runner.os }} \
          bin/configr.dart -o ${{ matrix.output_name }}

      - name: Generate API docs
        run: mkdir -p doc/api && dart run tool/generate_metadata.dart --no-stdlib

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p staging
          cp -r doc/api staging/doc/api
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "${{ matrix.output_name }}.exe" staging/configr
            powershell -Command "Compress-Archive -Path staging/configr, staging/doc/api -DestinationPath ${{ matrix.output_name }}.zip -Force"
          else
            cp "${{ matrix.output_name }}" staging/configr
            cd staging && zip -r "../${{ matrix.output_name }}.zip" configr doc/api && cd ..
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_name }}
          path: ${{ matrix.output_name }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            configr-linux.zip
            configr-windows.zip
            configr-macos.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
