name: Build and Release

permissions:
  contents: write
  actions: write

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

jobs:
  build:
    name: Build and Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            output-name: configr-linux
          - os: windows-latest
            output-name: configr-windows
          - os: macos-latest
            output-name: configr-macos

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Build executable
        run: dart compile exe -Dversion=${{ github.ref_name }} bin/configr.dart -o ${{ matrix.output-name }}

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p staging
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "${{ matrix.output-name }}.exe" staging/configr
            powershell -Command "Compress-Archive -Path staging/configr -DestinationPath ${{ matrix.output-name }}.zip -Force"
          else
            cp "${{ matrix.output-name }}" staging/configr
            cd staging && zip -r "../${{ matrix.output-name }}.zip" configr && cd ..
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output-name }}
          path: ${{ matrix.output-name }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            configr-linux.zip
            configr-windows.zip
            configr-macos.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
